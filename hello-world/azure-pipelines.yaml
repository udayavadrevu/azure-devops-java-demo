trigger:
- main

pr:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: Maven@4
  displayName: 'Build using Maven'
  inputs:
    mavenPomFile: 'hello-world/pom.xml'
    goals: 'clean package'

- task: PublishPipelineArtifact@1
  displayName: 'Publish JAR Artifact'
  inputs:
    targetPath: 'hello-world/target'
    artifact: 'drop'